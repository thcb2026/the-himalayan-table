name = "the-himalayan-table"
account_id = "ce027662d92cfb76ed3a1d42da2edb30"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[build]
command = "npm run build"

[assets]
 directory = "dist"
 binding = "ASSETS"
 run_worker_first = true

[env.development]
name = "the-himalayan-table-dev"

[env.production]
name = "the-himalayan-table-prod"
workers_dev = true

[env.production.vars]
BACKEND_ORIGIN = "http://ec2-44-209-235-43.compute-1.amazonaws.com:5002"
BACKEND_FALLBACK_ORIGINS = "http://ec2-44-209-235-43.compute-1.amazonaws.com:5002"
UPSTREAM_TIMEOUT_MS = 15000
ENVIRONMENT = "production"
# Allow the worker to use the private ECS backend over HTTP when that is the only supported path.
ALLOW_INSECURE_UPSTREAM = "true"

## Environment-specific vars are set per-env. Publishing with
## `npx wrangler publish --env production` will use [env.production.vars].
